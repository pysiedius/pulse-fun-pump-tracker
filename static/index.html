<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Pulse — Pump.fun Tracker</title><style>:root{--bg:#07080c;--panel:#10131a;--line:#232a36;--text:#e8edf5;--muted:#8b97a8;--green:#3dff8a;--red:#ff5d6c;--amber:#ffc857;--blue:#6aa8ff;--purple:#b38cff}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,sans-serif}a{color:var(--blue);text-decoration:none}button,input,select{font:inherit;color:inherit}.app{display:grid;grid-template-rows:56px 1fr;height:100%}header{display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line)}.logo{font-weight:700;letter-spacing:.08em}.logo span{color:var(--green)}.tab{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer}.tab.on{color:var(--text);border-color:var(--line)}.grow{flex:1}.pill{color:var(--muted);border:1px solid var(--line);padding:4px 8px;border-radius:999px}.pill b{color:var(--green)}.btn{background:var(--green);color:#04150b;border:0;border-radius:8px;padding:7px 10px;font-weight:700;cursor:pointer}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}.btn.danger{background:var(--red);color:#fff}main{display:none;overflow:hidden}main.on{display:grid}#coins{grid-template-rows:auto 1fr}#wallets{grid-template-columns:380px 1fr}.toolbar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}input,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px}table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);position:sticky;top:0;background:#0c1017}.sym{display:flex;align-items:center;gap:8px}.av{width:28px;height:28px;border-radius:50%;background:#222;object-fit:cover}.muted{color:var(--muted)}.up{color:var(--green)}.tag{font-size:10px;padding:2px 6px;border-radius:999px;border:1px solid var(--line)}.tag.live{color:var(--green)}.tag.grad{color:var(--purple)}.side{border-right:1px solid var(--line);overflow:auto;padding:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}.feed{overflow:auto;padding:14px}.trade{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--panel)}.warn{color:var(--amber);font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{color:var(--muted);font-size:11px;display:block;margin-bottom:4px}.bar{height:4px;background:#1c2430;border-radius:99px;overflow:hidden;width:72px;display:inline-block}.bar i{display:block;height:100%;background:var(--green)}.toast{position:fixed;bottom:16px;right:16px;background:#142018;border:1px solid #2c6;color:var(--green);padding:10px 12px;border-radius:10px;display:none}.table-wrap{overflow:auto}</style></head><body><div class="app"><header><div class="logo">PULSE<span>.FUN</span></div><nav class="tabs"><button class="tab on" data-tab="coins">Live coins</button><button class="tab" data-tab="wallets">Copy trade</button></nav><div class="grow"></div><div class="pill">SOL <b id="solPrice">—</b></div><div class="pill" id="status">connecting</div><button class="btn ghost" id="connectBtn">Connect Phantom</button></header><main id="coins" class="on"><div class="toolbar"><input id="search" placeholder="Search name, ticker, mint" style="min-width:240px"/><select id="sort"><option value="last_trade_timestamp">Last trade</option><option value="created_timestamp">Newest</option><option value="market_cap">Market cap</option></select><select id="filter"><option value="all">All</option><option value="curve">On curve</option><option value="graduated">Graduated</option><option value="live">Livestream</option></select><button class="btn ghost" id="refresh">Refresh</button><span class="muted" id="count"></span></div><div class="table-wrap"><table><thead><tr><th>Token</th><th>Price</th><th>MC USD</th><th>MC SOL</th><th>Curve</th><th>Age</th><th>Status</th><th></th></tr></thead><tbody id="coinRows"></tbody></table></div></main><main id="wallets"><div class="side"><div class="card"><div class="row"><b>Copy settings</b><span class="muted" id="walletLabel">no wallet</span></div><div class="grid2" style="margin-top:10px"><div><label>Size (SOL)</label><input id="sizeSol" type="number" step="0.01" value="0.1"/></div><div><label>Slippage %</label><input id="slip" type="number" step="0.1" value="15"/></div></div><div class="row" style="margin-top:10px"><span class="muted">Auto-copy armed</span><button class="btn ghost" id="armBtn">Arm</button></div><p class="warn" style="margin-top:8px">No private keys stored. You approve every tx in Phantom.</p></div><div class="card"><b>Trench dev wallets</b><p class="muted" style="margin:6px 0 8px">High graduation-rate deployers.</p><div id="walletList"></div><div class="row" style="margin-top:8px"><input id="customWallet" placeholder="Add wallet address" style="flex:1"/><button class="btn ghost" id="addWallet">Add</button></div></div></div><div class="feed"><div class="row" style="margin-bottom:10px"><b>Copy feed</b><button class="btn ghost" id="clearFeed">Clear</button></div><div id="feed"></div></div></main></div><div class="toast" id="toast"></div><script>const WALLETS=[{addr:"58Ursk3D3sZt4CrUpuJoWjmY17Xwy8XMHmg4tDhKqDYJ",label:"Dev-01",wr:100,pf:315,note:"19/19 launched"},{addr:"2E94st2NZnzA943HBceijgkw75gXTTxch39yquMBfeQk",label:"Dev-02",wr:66.7,pf:3667,note:"28/42 launched"},{addr:"yHCxHBEaJW5tbndqC8JciSThr7U1cqLpdcsvHcx6PRe",label:"Ansem creator",wr:63.1,pf:12700,note:"157/249 launched"},{addr:"ARW9NzhpuBVYaYBZo6fW1P1U6LTNwUY6jfi7XC37Sa97",label:"Dev-04",wr:69,pf:479,note:"49/71 launched"},{addr:"GeBJSHK4WsGrz2HRvTbqvWGx4JRMpHfJG2ikzrYBDuwR",label:"Dev-05",wr:56.9,pf:931,note:"78/137 launched"}];const state={coins:[],sol:0,following:JSON.parse(localStorage.getItem("pulse.follow")||JSON.stringify(WALLETS.map(w=>w.addr))),armed:false,pubkey:null,copied:JSON.parse(localStorage.getItem("pulse.feed")||"[]")};const $=id=>document.getElementById(id);const short=s=>s?s.slice(0,4)+"\u2026"+s.slice(-4):"";const usd=n=>{n=Number(n)||0;if(n>=1e6)return"$"+(n/1e6).toFixed(2)+"M";if(n>=1e3)return"$"+(n/1e3).toFixed(1)+"K";if(n>=1)return"$"+n.toFixed(2);return"$"+n.toPrecision(3)};const num=n=>{n=Number(n)||0;if(n>=1e6)return(n/1e6).toFixed(2)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"K";return n.toFixed(2)};const age=ts=>{if(!ts)return"\u2014";const m=Math.max(0,Math.floor((Date.now()-Number(ts))/60000));if(m<60)return m+"m";const h=Math.floor(m/60);return h<48?h+"h":Math.floor(h/24)+"d"};const toast=msg=>{const el=$("toast");el.textContent=msg;el.style.display="block";setTimeout(()=>el.style.display="none",2200)};const priceOf=c=>{const supply=Number(c.total_supply||0)/(10**Number(c.base_decimals||6));const mc=Number(c.usd_market_cap||c.market_cap_usd||0);return supply>0?mc/supply:0};const curvePct=c=>{if(c.complete)return 100;return Math.max(0,Math.min(99,(Number(c.virtual_sol_reserves||0)/1e9/85)*100))};async function loadSol(){const d=await(await fetch("/api/sol-price")).json();state.sol=d.solPrice||0;$("solPrice").textContent="$"+Number(state.sol).toFixed(2)}async function loadCoins(){$("status").textContent="syncing";const sort=$("sort").value;const all=[];for(const offset of[0,50,100]){const r=await fetch(`/api/coins?offset=${offset}&limit=50&sort=${sort}&order=DESC&includeNsfw=false`);if(!r.ok)continue;const rows=await r.json();if(Array.isArray(rows))all.push(...rows)}const seen=new Set();state.coins=all.filter(c=>c&&c.mint&&!seen.has(c.mint)&&seen.add(c.mint));$("status").textContent="live \u00b7 "+state.coins.length;renderCoins()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&","<":"<",">":">","\"":""","'":"&#39;"}[m]))}function renderCoins(){const q=$("search").value.trim().toLowerCase();const f=$("filter").value;let rows=state.coins;if(q)rows=rows.filter(c=>(c.name||"").toLowerCase().includes(q)||(c.symbol||"").toLowerCase().includes(q)||(c.mint||"").toLowerCase().includes(q));if(f==="curve")rows=rows.filter(c=>!c.complete);if(f==="graduated")rows=rows.filter(c=>c.complete);if(f==="live")rows=rows.filter(c=>c.is_currently_live);$("count").textContent=rows.length+" coins";$("coinRows").innerHTML=rows.map(c=>{const px=priceOf(c);const pct=curvePct(c);return `<tr><td><div class="sym"><img class="av" src="${c.image_uri||""}" onerror="this.style.opacity=0"/><div><div><b>${escapeHtml(c.symbol||"?")}</b> <span class="muted">${escapeHtml(c.name||"")}</span></div><div class="muted mono">${short(c.mint)}</div></div></div></td><td class="mono">${px?px.toPrecision(4):"\u2014"}</td><td>${usd(c.usd_market_cap||c.market_cap_usd)}</td><td>${num(c.market_cap)} SOL</td><td><span class="bar"><i style="width:${pct}%"></i></span> ${c.complete?"grad":pct.toFixed(0)+"%"}</td><td class="muted">${age(c.created_timestamp)}</td><td>${c.is_currently_live?'<span class="tag live">LIVE</span>':""}${c.complete?'<span class="tag grad">GRAD</span>':'<span class="tag">CURVE</span>'}</td><td><button class="btn ghost" onclick="copyMint('${c.mint}')">CA</button> <button class="btn ghost" onclick="openPump('${c.mint}')">Trade</button> <button class="btn" onclick="queueCopy('${c.mint}','${escapeHtml(c.symbol)}','manual')">Copy</button></td></tr>`}).join("")}function copyMint(mint){navigator.clipboard.writeText(mint);toast("Mint copied")}function openPump(mint){window.open("https://pump.fun/coin/"+mint,"_blank")}function renderWallets(){$("walletList").innerHTML=WALLETS.concat(state.following.filter(a=>!WALLETS.some(w=>w.addr===a)).map(a=>({addr:a,label:"Custom",wr:0}))).map(w=>{const on=state.following.includes(w.addr);return `<div class="card" style="padding:8px"><div class="row"><div><b>${w.label}</b><div class="muted mono">${short(w.addr)}</div></div><div style="text-align:right"><div class="up">${w.note||"\u2014"}</div><div class="muted">${w.wr?w.wr+"% grad":""} ${w.pf?"\u00b7 "+w.pf+" PF":""}</div></div></div><div class="row" style="margin-top:8px"><a href="https://solscan.io/account/${w.addr}" target="_blank">Solscan</a><button class="btn ${on?"danger":""}" onclick="toggleFollow('${w.addr}')">${on?"Unfollow":"Follow"}</button></div></div>`}).join("");renderFeed()}function toggleFollow(addr){if(state.following.includes(addr))state.following=state.following.filter(a=>a!==addr);else{state.following.push(addr);pushFeed({type:"follow",addr,t:Date.now()})}localStorage.setItem("pulse.follow",JSON.stringify(state.following));renderWallets()}function pushFeed(item){state.copied.unshift(item);state.copied=state.copied.slice(0,80);localStorage.setItem("pulse.feed",JSON.stringify(state.copied));renderFeed()}function renderFeed(){if(!state.copied.length){$("feed").innerHTML='<p class="muted">Follow wallets, then arm copy.</p>';return}$("feed").innerHTML=state.copied.map(it=>it.type==="follow"?`<div class="trade">Following <span class="mono">${short(it.addr)}</span></div>`:`<div class="trade"><div class="row"><b>${escapeHtml(it.symbol||"TOKEN")}</b><span class="up">${(it.side||"buy").toUpperCase()} ${it.size} SOL</span></div><div class="muted mono">${short(it.mint)} \u00b7 from ${short(it.from||"you")}</div></div>`).join("")}async function queueCopy(mint,symbol,from){const size=Number($("sizeSol").value||0.1);pushFeed({type:"copy",side:"buy",mint,symbol,size,from,t:Date.now()});toast("Copy queued \u00b7 "+symbol);openPump(mint)}async function connectWallet(){const p=window.solana;if(!p||!p.isPhantom){window.open("https://phantom.app","_blank");toast("Install Phantom");return}const res=await p.connect();state.pubkey=res.publicKey.toString();$("connectBtn").textContent=short(state.pubkey);$("walletLabel").textContent=short(state.pubkey);toast("Wallet connected")}document.querySelectorAll(".tab").forEach(btn=>{btn.onclick=()=>{document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));document.querySelectorAll("main").forEach(m=>m.classList.remove("on"));btn.classList.add("on");$(btn.dataset.tab).classList.add("on")}});$("search").oninput=renderCoins;$("filter").onchange=renderCoins;$("sort").onchange=loadCoins;$("refresh").onclick=loadCoins;$("connectBtn").onclick=connectWallet;$("addWallet").onclick=()=>{const a=$("customWallet").value.trim();if(a.length<32)return toast("Invalid address");if(!state.following.includes(a))state.following.push(a);localStorage.setItem("pulse.follow",JSON.stringify(state.following));$("customWallet").value="";renderWallets()};$("clearFeed").onclick=()=>{state.copied=[];localStorage.removeItem("pulse.feed");renderFeed()};$("armBtn").onclick=()=>{state.armed=!state.armed;$("armBtn").textContent=state.armed?"Armed":"Arm";$("armBtn").className=state.armed?"btn danger":"btn ghost"};loadSol();loadCoins();renderWallets();setInterval(loadSol,30000);setInterval(loadCoins,12000);</script></body></html>
